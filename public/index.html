<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Temp Mail Browser</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="page">
      <header class="page-header">
        <div>
          <h1>Temp Mail Browser</h1>
          <p>Danh sách email nhận được qua SMTP.</p>
        </div>
        <div class="header-actions">
          <div class="search-field">
            <input id="searchInput" type="search" placeholder="Search from/to..." autocomplete="off">
            <button id="clearSearchButton" class="clear-search-button" type="button" aria-label="Xóa tìm kiếm" hidden>×</button>
          </div>
          <button id="refreshButton" type="button">Làm mới</button>
          <button id="openSavedMailboxDrawerButton" type="button">Saved mails</button>
        </div>
      </header>

      <section class="card two-factor-card">
        <div class="two-factor-field">
          <input id="twoFactorSecretInput" type="text" placeholder=" " autocomplete="off" spellcheck="false">
          <label for="twoFactorSecretInput">Paste 2FA secret here (auto refresh)</label>
          <button id="clearTwoFactorSecretButton" class="clear-search-button" type="button" aria-label="Xóa 2FA secret" hidden>×</button>
        </div>
        <button id="twoFactorCodeButton" class="code-button" type="button" data-code="" disabled>—</button>
      </section>

      <section class="card">
        <table>
          <thead>
            <tr>
              <th>Subject</th>
              <th>From / To</th>
              <th>Code</th>
              <th>Created</th>
              <th>Thao tác</th>
            </tr>
          </thead>
          <tbody id="emailRows">
            <tr>
              <td colspan="5" class="empty">Đang tải...</td>
            </tr>
          </tbody>
        </table>
      </section>
    </main>

    <div id="savedMailboxDrawerBackdrop" class="saved-mailbox-drawer-backdrop" hidden></div>
    <aside id="savedMailboxDrawer" class="saved-mailbox-drawer" aria-labelledby="savedMailboxDrawerTitle" aria-hidden="true" tabindex="-1">
      <header class="saved-mailbox-drawer-header">
        <div>
          <h2 id="savedMailboxDrawerTitle">Saved mails</h2>
          <p>Danh sách temp mail đã lưu.</p>
        </div>
        <button id="closeSavedMailboxDrawerButton" type="button" aria-label="Đóng">×</button>
      </header>
      <button id="openSavedMailboxModalButton" type="button">Save mail</button>
      <div id="savedMailboxList" class="saved-mailbox-list" role="list" aria-live="polite">
        <p class="empty" role="listitem">Đang tải...</p>
      </div>
    </aside>

    <dialog id="savedMailboxModal" aria-labelledby="savedMailboxModalTitle">
      <article class="modal-card">
        <header class="modal-header">
          <h2 id="savedMailboxModalTitle">Save mail</h2>
          <button id="closeSavedMailboxModalButton" type="button" aria-label="Đóng">×</button>
        </header>
        <form id="savedMailboxForm" class="saved-mailbox-form">
          <label>
            Mail
            <input id="savedMailboxAddressInput" type="email" required maxlength="254" autocomplete="off" placeholder="name@example.com">
          </label>
          <label>
            Lý do lưu
            <textarea id="savedMailboxReasonInput" maxlength="500" placeholder="Có thể bỏ trống"></textarea>
          </label>
          <button id="savedMailboxSubmitButton" type="submit">Lưu</button>
        </form>
      </article>
    </dialog>

    <dialog id="emailModal" aria-labelledby="emailModalTitle">
      <article class="modal-card">
        <header class="modal-header">
          <h2 id="emailModalTitle">Chi tiết email</h2>
          <button id="closeModalButton" type="button" aria-label="Đóng">×</button>
        </header>
        <dl class="details">
          <div><dt>From</dt><dd id="detailFrom"></dd></div>
          <div><dt>To</dt><dd class="detail-address-row"><span id="detailTo"></span><button id="saveDetailToButton" type="button" aria-label="Lưu mail nhận">💾</button></dd></div>
          <div><dt>Subject</dt><dd id="detailSubject"></dd></div>
        </dl>
        <div id="detailBody" class="mail-body"></div>
      </article>
    </dialog>

    <script src="/two-factor-auth.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
